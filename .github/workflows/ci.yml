name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # G-125: OSV-Scanner over package-lock.json; fails on a high or critical finding (CVSS 7.0 or more)
      # that has a fixed version.
      - name: Dependency scan (OSV-Scanner)
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output "$RUNNER_TEMP/osv.json" .
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then echo "osv-scanner did not complete (exit $code)"; exit "$code"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]? | "\(.max_severity // "?")\t\($p.ecosystem) \($p.name) \($p.version)\t\(.ids | join(","))"' "$RUNNER_TEMP/osv.json" | sort -rn
          high=$(jq '[.results[]?.packages[]? | .vulnerabilities as $v | .groups[]? | select(((.max_severity // "") | tonumber? // 0) >= 7) | .ids as $ids | select([$v[]? | select(.id as $i | $ids | index($i)) | .affected[]?.ranges[]?.events[]? | select(.fixed)] | length > 0)] | length' "$RUNNER_TEMP/osv.json")
          echo "high or critical with a fixed version: $high"
          test "$high" -eq 0
